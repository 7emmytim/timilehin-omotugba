<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Share image</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600&family=Instrument+Serif:ital@1&display=block" rel="stylesheet" />
<style>
  /* The link preview image, rendered to public/og-image.png by
     scripts/og-image.mjs. Same paper, ink and leaf colours as the site. */
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 1200px; height: 630px; }
  body {
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 72px 80px 64px;
    background: #f7f6f2; color: #14151a;
    font-family: "Instrument Sans", system-ui, sans-serif;
  }
  .pill {
    align-self: flex-start;
    display: inline-flex; align-items: center; gap: 10px;
    padding: 8px 16px; border-radius: 999px;
    background: #e7f1eb; border: 1px solid #c5dfd0;
    color: #2a6e4c; font-size: 22px; font-weight: 600;
  }
  .pill i {
    width: 10px; height: 10px; border-radius: 50%; background: #2a6e4c;
    box-shadow: 0 0 0 5px rgba(42, 110, 76, 0.15);
  }
  h1 {
    max-width: 15ch;
    font-size: 84px; line-height: 0.98; font-weight: 600; letter-spacing: -0.045em;
  }
  h1 em {
    font-family: "Instrument Serif", Georgia, serif;
    font-weight: 400; letter-spacing: -0.01em; color: #2a6e4c;
  }
  footer {
    display: flex; align-items: flex-end; justify-content: space-between;
    padding-top: 28px; border-top: 2px solid #e4e2db;
  }
  .who b { display: block; font-size: 30px; font-weight: 600; letter-spacing: -0.02em; }
  .who span { font-size: 22px; color: #5b5f6b; }
  .site { font-size: 22px; font-weight: 600; color: #2a6e4c; }
</style>
</head>
<body>
  <span class="pill"><i></i>Open to work</span>
  <h1>I build websites and apps people <em>enjoy</em> using.</h1>
  <footer>
    <div class="who">
      <b>Timilehin Omotugba</b>
      <span>Frontend Engineer · React, Next.js, TypeScript</span>
    </div>
    <span class="site">timilehinomotugba.com</span>
  </footer>
</body>
</html>
